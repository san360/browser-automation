# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Foundry Browser Automation demo. One azd project that provisions and deploys:
#   ai-project     Foundry account + project + model deployments   (infra/foundry layer, microsoft.foundry provider)
#   platform layer Playwright workspace, project connections, RBAC, monitoring, demo site infra, budget (infra/platform)
#   web-qa-agent   Hosted agent (Agent Framework) using the Browser Automation tool through a Foundry Toolbox
#   demo-site      Contoso Insurance target website (Azure Container Apps)
# The prompt agent is created on demand by the demo CLI with the azure-ai-projects SDK (src/prompt_agent).
name: foundry-browser-automation-demo
metadata:
  template: foundry-browser-automation-demo@1.0.0
requiredVersions:
  azd: '>=1.37.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.22'
    azure.ai.projects: '>=1.0.0-beta.15'
    azure.ai.toolboxes: '>=1.0.0-beta.12'

services:
  ai-project:
    host: azure.ai.project
    deployments:
      # Default model for the prompt and hosted agents (supports the Browser Automation tool).
      # Capacity is a TPM rate limit (300 = 300K tokens/min), not a cost: long browser runs resend context on every
      # step and each call also reserves max_output_tokens. Keep in sync with infra/foundry/main.parameters.json.
      - name: gpt-4.1-mini
        model:
          format: OpenAI
          name: gpt-4.1-mini
          version: '2025-04-14'
        sku:
          name: GlobalStandard
          capacity: 300
      # Stronger model for complex scenarios and for the Computer Use (computer tool) demo.
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: DataZoneStandard
          capacity: 300

  web-qa-agent:
    host: azure.ai.agent
    kind: hosted
    name: web-qa-agent
    description: >-
      Web QA agent that drives a cloud browser through the Foundry Browser Automation tool (via a Foundry Toolbox)
      and adds deterministic tools for HTTP security-header review, page-source signals and link checking.
      Use it for form filling, site search, UI bug troubleshooting and passive security reviews of sites you own.
    project: src/hosted_agent
    language: python
    uses:
      - ai-project
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${HOSTED_AGENT_MODEL=gpt-4.1-mini}
      TOOLBOX_NAME: ${TOOLBOX_NAME=browser-automation-tools}
      DEMO_SITE_URL: ${DEMO_SITE_URL}
      ALLOWED_SCAN_HOSTS: ${DEMO_SITE_HOST}
      # The hosting server records prompts, page snapshots and tool results (including the signed live-view link) in
      # Application Insights unless this is "false". Token usage spans are kept either way. Opt in for debugging with
      # `azd env set CAPTURE_MESSAGE_CONTENT true` and redeploy.
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${CAPTURE_MESSAGE_CONTENT=false}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

  demo-site:
    host: containerapp
    project: src/demo_site
    language: python
    resourceGroup: ${AZURE_PLATFORM_RESOURCE_GROUP}
    docker:
      path: Dockerfile
      remoteBuild: true
      registry: ${DEMO_SITE_REGISTRY_ENDPOINT}

infra:
  layers:
    # Generated by `azd ai agent init --infra`: Foundry account, project and model deployments.
    - name: foundry
      path: infra/foundry
      provider: microsoft.foundry
    # Everything else; consumes the foundry layer outputs (account, project, resource group).
    - name: platform
      path: infra/platform
      provider: bicep
      dependsOn:
        - foundry

hooks:
  postprovision:
    windows:
      shell: pwsh
      run: hooks/postprovision.ps1
    posix:
      shell: sh
      run: hooks/postprovision.sh
  postdeploy:
    windows:
      shell: pwsh
      run: hooks/postdeploy.ps1
      continueOnError: true
    posix:
      shell: sh
      run: hooks/postdeploy.sh
      continueOnError: true
