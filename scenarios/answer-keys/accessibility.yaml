# Accessibility issues planted on /bug-lab/claims/new (subset of the bug lab, WCAG 2.2 AA).
issues:
  - id: A11Y-01
    severity: Medium
    title: Logo image has no text alternative (WCAG 1.1.1)
    match_all_groups: [["alt", "text alternative"], ["logo", "image", "img"]]
  - id: A11Y-02
    severity: Medium
    title: Policy number label is not programmatically associated with its input (WCAG 1.3.1 / 3.3.2)
    match_all_groups: [["label"], ["policy", "associated", "for="]]
  - id: A11Y-03
    severity: Medium
    title: Hint text contrast below 4.5:1 (WCAG 1.4.3)
    match_all_groups: [["contrast"]]
  - id: A11Y-04
    severity: Medium
    title: Cookie dialog cannot be closed with its close control and blocks the page (WCAG 2.1.2 / 2.4.3)
    match_all_groups: [["cookie", "dialog", "modal"], ["close", "keyboard", "focus", "trap", "dismiss"]]
